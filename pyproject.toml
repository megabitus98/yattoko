[project]
name = "yattoko"
version = "1.0.0"
description = "Telegram bot that downloads videos with yt-dlp"
authors = [
    {name = "Benny", email = "benny.think@gmail.com"},
    {name = "Katze_942", email = "rs5334819@gmail.com"}
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.10.26",
    "curl-cffi",
    "kurigram[fast]==2.2.27",
    "SQLAlchemy",
    "fakeredis",
    "redis",
    "requests",
    "filetype",
    "beautifulsoup4",
    "psutil",
    "python-dotenv",
    "ffmpeg-python",
    "tqdm",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = ["pytest", "black", "pyyaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
