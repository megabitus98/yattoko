# actionlint: the home runner's custom label (deploy/README.md, "Home runner")
self-hosted-runner:
  labels:
    - ytdlbot-regression
paths:
  .github/workflows/ci.yml:
    ignore:
      # `concurrency.queue` (GitHub's workflow syntax docs) is newer than actionlint 1.7.12
      - 'unexpected key "queue" for "concurrency" section'
