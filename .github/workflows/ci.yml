# Every PR from a branch of this repository: Dependabot's and the owner's (never from forks; once public,
# a fork's runs wait for the owner's approval, see deploy/README.md). Code from the PR, including new
# dependency versions, runs only in jobs that hold no write token:
#   unit        GitHub runner, read-only: repository checks, the image build, unit tests; saves the image
#   scan        GitHub runner, read-only: uv audit; fails on vulnerabilities the PR adds to its base
#   push        GitHub runner, packages: write, no checkout: loads that image, pushes it as sha-<head sha>
#   regression  the home runner, read-only: real downloads in the pushed image (src/regression/README.md)
#   merge       GitHub runner, Dependabot uv PRs only: squash-merges a green PR level with main, starts promote
#   cleanup     GitHub runner: deletes the image artifact, whatever happened
#   notify      GitHub runner: tells the owner through the test bot when a job failed or was cancelled
# A job with a write token runs no action (`uses:`) and nothing from the image: a PR, Dependabot's
# github-actions updates included, chooses the action versions of its own run. The job ids are the
# check names promote.yml requires; no job has a `name:`. Nothing is built on push to main.
# Modified 2026 by megabitus98 (fork): new workflow (spec 6.14)

name: ci

on:
  pull_request:

permissions: {} # each job asks for its own

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  head_sha: ${{ github.event.pull_request.head.sha }}
  image: ghcr.io/${{ github.repository }}

jobs:
  unit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read # also the release tags
      pull-requests: read # the PR title, read live
      actions: read # promote runs on the base commit
    env:
      UV_MALWARE_CHECK: "1" # uv stops before installing a version OSV lists as malware; fails closed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0 # tests/repo compares with the upstream base commit

      # The release this PR becomes, baked into the image; promote.yml works it out again and checks it.
      # The token is in this step's env only: the steps below run the PR's code.
      - name: Release version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
        run: |
          # >>> release rule (identical in ci.yml and promote.yml; tests/repo/test_pipeline_files.py checks it)
          title_pattern='^(feat|fix|deps|docs|ci|test|build|chore|refactor|perf)(\([a-z0-9-]+\))?(!)?: .+'
          # next_version <previous tag or empty> <PR title>: the release this PR becomes; fails on an unknown title
          next_version() {
            local previous=$1 title=$2 type breaking major minor patch
            [[ "$title" =~ $title_pattern ]] || return 1
            type=${BASH_REMATCH[1]}
            breaking=${BASH_REMATCH[3]}
            if [ -z "$previous" ]; then echo v1.0.0; return 0; fi
            IFS=. read -r major minor patch <<< "${previous#v}"
            if [ -n "$breaking" ]; then echo "v$((major + 1)).0.0"
            elif [ "$type" = feat ]; then echo "v$major.$((minor + 1)).0"
            else echo "v$major.$minor.$((patch + 1))"; fi
          }
          # previous_tag <commit>: the highest vX.Y.Z tag on that commit or one of its ancestors (empty: none yet).
          # An API error fails (an empty answer would mean "no tags" and restart at v1.0.0); no tags at all is not an error.
          previous_tag() {
            local all_tags tag_name tag_sha status
            all_tags=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[] | "\(.name) \(.commit.sha)"') || return 1
            while read -r tag_name tag_sha; do
              status=$(gh api "repos/$GH_REPO/compare/$tag_sha...$1" --jq .status) || return 1
              case $status in ahead|identical) echo "$tag_name"; return 0 ;; esac
            done < <(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+ ' <<< "$all_tags" | sort -rV)
          }
          # previous_release <commit>...: the highest previous_tag over the given commits; promote passes every
          # parent of main's commit (after "Update branch" and a fast-forward, the first parent is the PR branch)
          previous_release() {
            local commit_sha found found_tags=""
            for commit_sha in "$@"; do
              found=$(previous_tag "$commit_sha") || return 1
              [ -n "$found" ] && found_tags+="$found"$'\n'
            done
            printf '%s' "$found_tags" | sort -V | tail -n 1
          }
          # <<< release rule

          # live, not from the event: a re-run reuses the event, so it would miss a title fixed since
          pr_title=$(gh api "repos/$GH_REPO/pulls/$pr_number" --jq .title)
          base_sha=$(git merge-base HEAD refs/remotes/origin/main)
          # the commit this PR sits on may still be getting its release: number from it once it has one
          for attempt in $(seq 1 90); do
            active=$(gh api "repos/$GH_REPO/actions/workflows/promote.yml/runs?head_sha=$base_sha&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$active" = 0 ] && break
            if [ "$attempt" = 90 ]; then
              echo "::error::promote for the base commit $base_sha is still running after 15 minutes"
              exit 1
            fi
            sleep 10
          done
          previous=$(previous_release "$base_sha")
          if ! version=$(next_version "$previous" "$pr_title"); then
            echo "::error::the PR title must match $title_pattern (feat: minor, fix:/deps:/docs:/... patch, type! major)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s' "$version" > "$RUNNER_TEMP/release/version"
          printf '%s' "$pr_title" > "$RUNNER_TEMP/release/title"
          printf '%s' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$version" > "$RUNNER_TEMP/release/url"
          echo "Release version: $version (previous: ${previous:-none})" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8" # the uv image in the Dockerfile
          enable-cache: "false"

      - name: Repository checks
        run: uv run --locked pytest -q tests/repo # --locked: a stale uv.lock fails here, it is not rewritten

      - name: Build the runtime and test images
        run: |
          lock_version() { awk -v pkg="$1" '$0 == "name = \"" pkg "\"" {getline; gsub(/"/, ""); print $3}' uv.lock; }
          yt_dlp_version=$(lock_version yt-dlp)
          curl_cffi_version=$(lock_version curl-cffi)
          kurigram_version=$(lock_version kurigram)
          : "${yt_dlp_version:?not in uv.lock}" "${curl_cffi_version:?not in uv.lock}" "${kurigram_version:?not in uv.lock}"
          release_version=$(cat "$RUNNER_TEMP/release/version")
          release_title=$(cat "$RUNNER_TEMP/release/title")
          release_url=$(cat "$RUNNER_TEMP/release/url")
          # the same arguments for both targets, so the test image sits on the exact runtime layers
          build_args=(
            --platform linux/amd64
            --build-arg YT_DLP_VERSION="$yt_dlp_version"
            --build-arg CURL_CFFI_VERSION="$curl_cffi_version"
            --build-arg KURIGRAM_VERSION="$kurigram_version"
            --build-arg APP_VERSION="$release_version"
            --build-arg APP_RELEASE_TITLE="$release_title"
            --build-arg APP_RELEASE_URL="$release_url"
          )
          docker build "${build_args[@]}" --target runtime -t yattoko:runtime .
          docker build "${build_args[@]}" --target test -t yattoko:test .

      - name: Unit tests
        run: docker run --rm yattoko:test

      - name: Save the runtime image
        run: docker save yattoko:runtime | gzip -1 > "$RUNNER_TEMP/yattoko-image.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yattoko-image
          path: ${{ runner.temp }}/yattoko-image.tar.gz
          compression-level: 0 # already gzipped
          retention-days: 1 # cleanup deletes it sooner; the plan's artifact storage is small
          if-no-files-found: error

  scan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      base_sha: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0 # the base commit's lock is compared

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: "false"

      - name: Audit the lock against its base
        run: |
          # uv reads pyproject.toml and uv.lock only; nothing from the PR is built or run. The image's
          # platform, so environment markers resolve as they do in the image. Without a report (OSV
          # unreachable, a uv error) the job fails: no report is not a clean report.
          audit() {
            (cd "$1" && uv audit --frozen --python-version 3.12 --python-platform x86_64-unknown-linux-musl \
              --output-format json) > "$2" || true
            jq -e .summary "$2" > /dev/null || { echo "::error::uv audit gave no report for $1"; exit 1; }
          }
          keys() { jq -r '.vulnerabilities[] | "\(.dependency.name) \(.id)"' "$1" | sort -u; }

          mkdir "$RUNNER_TEMP/base"
          git show "$base_sha:pyproject.toml" > "$RUNNER_TEMP/base/pyproject.toml"
          git show "$base_sha:uv.lock" > "$RUNNER_TEMP/base/uv.lock"
          audit "$RUNNER_TEMP/base" "$RUNNER_TEMP/base.json"
          audit . "$RUNNER_TEMP/head.json"

          added=$(comm -13 <(keys "$RUNNER_TEMP/base.json") <(keys "$RUNNER_TEMP/head.json"))
          known=$(keys "$RUNNER_TEMP/base.json" | wc -l)
          {
            echo "### uv audit"
            echo "Known before this PR (reported by the weekly job, not blocking): $known"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$added" ]; then
            # the added ones with their fix versions, for the owner reading the failure
            jq -r --arg added "$added" '($added | split("\n")) as $keys | .vulnerabilities[]
              | select(("\(.dependency.name) \(.id)") as $key | $keys | index($key))
              | "\(.dependency.name) \(.dependency.version): \(.id) (\(.display_id)), fixed in: \(.fix_versions | join(", ") | if . == "" then "nothing yet" else . end)"' \
              "$RUNNER_TEMP/head.json" | sort -u > "$RUNNER_TEMP/added.txt"
            { echo "Added by this PR:"; echo '```'; cat "$RUNNER_TEMP/added.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::this PR adds known vulnerabilities: $(echo "$added" | tr '\n' ';')"
            exit 1
          fi

  push:
    needs: [unit, scan]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      packages: write # push sha-<head sha>
      actions: read # fetch the image artifact
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No checkout and no action: nothing chosen by the PR runs here. The archive is fetched with the
      # runner's own gh, checked against the digest GitHub recorded at upload, loaded (never run), and
      # only the one tag computed here is pushed, whatever else the archive names.
      - name: Push the tested image
        run: |
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "yattoko-image")] | sort_by(.created_at) | last | "\(.id) \(.digest)"')
          read -r artifact_id artifact_digest <<< "$artifact"
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo "::error::no image artifact in this run"; exit 1; }
          mkdir -p "$RUNNER_TEMP/image"
          gh api "repos/$GH_REPO/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/image.zip"
          [ "sha256:$(sha256sum "$RUNNER_TEMP/image.zip" | cut -d' ' -f1)" = "$artifact_digest" ] \
            || { echo "::error::the image artifact does not match its upload digest ($artifact_digest)"; exit 1; }
          unzip -q "$RUNNER_TEMP/image.zip" yattoko-image.tar.gz -d "$RUNNER_TEMP/image"
          docker load -i "$RUNNER_TEMP/image/yattoko-image.tar.gz"
          docker tag yattoko:runtime "$image:sha-$head_sha"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # the regression may already have run on this tag; a re-run must not move it to another digest
          if docker buildx imagetools inspect "$image:sha-$head_sha" >/dev/null 2>&1; then
            echo "$image:sha-$head_sha already exists, kept as it is"
          else
            docker push "$image:sha-$head_sha"
          fi
          docker logout ghcr.io

  regression:
    needs: push
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, yattoko-regression]
    timeout-minutes: 45
    permissions:
      packages: read # pull sha-<head sha> while the package is private
    env:
      # the test bot only, never the production bot; Dependabot's runs read these from the Dependabot secrets
      TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
      TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
      APP_ID: ${{ secrets.TEST_APP_ID }}
      APP_HASH: ${{ secrets.TEST_APP_HASH }}
    steps:
      # No checkout: the run, its link list and its settings are inside the image under test.
      - name: Real downloads in the pushed image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config" # the registry login never outlives the job
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image:sha-$head_sha"
          docker logout ghcr.io
          upload=()
          missing=$(for name in TEST_BOT_TOKEN TEST_CHAT_ID APP_ID APP_HASH; do [ -n "${!name}" ] || printf '%s ' "$name"; done)
          if [ -z "$missing" ]; then
            upload=(--upload)
          elif [ "$missing" = "TEST_BOT_TOKEN TEST_CHAT_ID APP_ID APP_HASH " ]; then
            echo "::warning::no test bot secrets: downloads only, the upload was not checked"
          else
            echo "::error::test bot secrets incomplete, missing: $missing(APP_ID and APP_HASH come from TEST_APP_ID and TEST_APP_HASH; Dependabot's runs read the Dependabot secrets)"
            exit 1
          fi
          # the production security context; the runner host keeps containers off private addresses
          exit_code=0
          docker run --rm --read-only --user 10001:10001 --tmpfs /tmp:size=10g \
            --cap-drop=ALL --security-opt no-new-privileges \
            -e TEST_BOT_TOKEN -e TEST_CHAT_ID -e APP_ID -e APP_HASH \
            "$image:sha-$head_sha" python /app/regression/run.py "${upload[@]}" \
            > "$RUNNER_TEMP/regression.jsonl" || exit_code=$?
          { echo "### Regression"; echo '```'; cat "$RUNNER_TEMP/regression.jsonl"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "$exit_code" in
            0) ;;
            2) echo "::error::downloader broken (see the JSON lines in the summary)" ;;
            3) echo "::error::a link is gone: replace it in src/regression/links.json" ;;
            *) echo "::error::the regression run could not start (exit $exit_code): no network or DNS?" ;;
          esac
          exit "$exit_code"

      - name: Clean up
        if: always()
        run: |
          docker image rm "$image:sha-$head_sha" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/docker-config"

  merge:
    needs: regression
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/uv/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # squash-merge
      pull-requests: write # merge, the rebase comment
      actions: write # start promote: a merge made with GITHUB_TOKEN starts no push workflow
    concurrency:
      group: merge # one merge decision at a time, each against the main it just read
      cancel-in-progress: false
      queue: max # the default keeps one waiting job and cancels the one before it
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
    steps:
      - name: Merge, or ask for a rebase
        run: |
          # Dependabot may have closed this PR for a newer one while this run was going
          pr_state=$(gh api "repos/$GH_REPO/pulls/$pr_number" --jq .state)
          if [ "$pr_state" != open ]; then
            echo "::notice::#$pr_number is $pr_state; nothing to merge"
            exit 0
          fi
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          : "${main_sha:?}"
          behind_by=$(gh api "repos/$GH_REPO/compare/$main_sha...$head_sha" --jq .behind_by)
          if [ "$behind_by" = 0 ]; then
            # main is the tested head's base, so the squash commit has exactly the tested tree
            gh pr merge "$pr_number" --squash --match-head-commit "$head_sha"
            # the tested head goes along, so promote need not find the brand-new commit's PR
            gh workflow run promote.yml --ref main -f head_sha="$head_sha"
            echo "Merged #$pr_number and started promote"
          else
            # merged now, main would hold a tree nobody tested; the rebased head runs this workflow again
            gh pr comment "$pr_number" --body "@dependabot rebase"
            echo "::notice::#$pr_number is $behind_by commit(s) behind main; asked Dependabot to rebase"
          fi

  cleanup:
    needs: [unit, push]
    # after a failed push the artifact stays (one day) so "Re-run failed jobs" can push it again
    if: always() && needs.push.result != 'failure' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: write # delete the image artifact
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the image artifact
        run: |
          # every copy of it in this run (a re-run of unit uploads another), or none; the listing is its
          # own command so that a failing call fails the job
          artifact_ids=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "yattoko-image") | .id')
          for artifact_id in $artifact_ids; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
          done

  notify:
    needs: [unit, scan, push, regression, merge, cleanup]
    if: >-
      always() && github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # is this run's head still the PR's head?
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
      TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
      text: "Yattoko: CI failed or was cancelled on PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }}). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    steps:
      - name: Tell the owner
        run: |
          # a run replaced by a newer head reports nothing (the new head's run does), nor does a closed PR
          pr_info=$(gh api "repos/$GH_REPO/pulls/$pr_number" --jq '"\(.state) \(.head.sha)"')
          read -r pr_state current_head <<< "$pr_info"
          if [ "$pr_state" != open ] || [ "$current_head" != "$head_sha" ]; then
            echo "PR is $pr_state at $current_head, this run was for $head_sha: not reported"
            exit 0
          fi
          if [ -z "$TEST_BOT_TOKEN" ] || [ -z "$TEST_CHAT_ID" ]; then
            # GitHub notifies whoever started a run, and Dependabot's runs were started by a bot
            echo "::error::no test bot secrets: nobody is told about this failure"
            exit 1
          fi
          # the token and the chat go through curl's config on stdin, not the command line
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\ndata-urlencode = "chat_id=%s"\n' "$TEST_BOT_TOKEN" "$TEST_CHAT_ID" |
            curl -fsS -K - --data-urlencode "text=$text" -o /dev/null
