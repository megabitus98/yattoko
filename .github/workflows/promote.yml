# The only writer of `stable` (spec 6.14). It runs on every push to main (a merge the owner made) and when
# ci.yml's merge job starts it (a merge made with GITHUB_TOKEN starts no push workflow). main's newest
# commit goes to `stable` only as the exact image its PR head was tested as: unit, scan, push and
# regression all green on that head, and the same tree. A commit that came from no PR (a direct push)
# promotes nothing and ships with the next tested update. A PR merge that does not match fails the run,
# which is how the owner hears about it.
# Modified 2026 by megabitus98 (fork): new workflow

name: promote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # commits and trees
      pull-requests: read # the PR a commit came from
      checks: read # unit, scan, push and regression on the tested head
      packages: write # tag stable
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      image: ghcr.io/${{ github.repository }}
    steps:
      - name: Promote the tested image
        run: |
          # green <sha>: every ci job the release depends on succeeded on that commit (each a check run;
          # the latest run of each); pending, skipped or missing is not green
          green() {
            local check_name conclusions
            for check_name in unit scan push regression; do
              conclusions=$(gh api "repos/$GH_REPO/commits/$1/check-runs?check_name=$check_name" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion] | unique | join(",")')
              if [ "$conclusions" != success ]; then
                echo "$check_name on $1: ${conclusions:-missing}"
                return 1
              fi
            done
          }
          fail() { echo "::error::$1"; exit 1; }

          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          : "${main_sha:?}"
          head_sha=$(gh api "repos/$GH_REPO/commits/$main_sha/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$main_sha\")][0].head.sha // empty")
          if [ -z "$head_sha" ]; then
            echo "::notice::main $main_sha came from no pull request; stable stays as it is and this commit ships with the next tested update"
            exit 0
          fi
          green "$head_sha" || fail "the tested head $head_sha of main $main_sha is not green; nothing promoted"
          main_tree=$(gh api "repos/$GH_REPO/git/commits/$main_sha" --jq .tree.sha)
          head_tree=$(gh api "repos/$GH_REPO/git/commits/$head_sha" --jq .tree.sha)
          [ -n "$main_tree" ] && [ "$main_tree" = "$head_tree" ] \
            || fail "main $main_sha and the tested head $head_sha have different trees (merged while behind main?); nothing promoted"

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest=$(docker buildx imagetools inspect "$image:sha-$head_sha" --format '{{.Manifest.Digest}}') \
            || fail "no image $image:sha-$head_sha; nothing promoted"
          stable=$(docker buildx imagetools inspect "$image:stable" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ "$stable" = "$digest" ]; then
            echo "stable is already $digest"
            exit 0
          fi
          # dated by the main commit, not the run, so a re-run does not mint another tag
          main_date=$(gh api "repos/$GH_REPO/commits/$main_sha" --jq .commit.committer.date)
          release="$(date -u -d "$main_date" +%Y.%m.%d)-${main_sha:0:7}"
          # --prefer-index=false: a carbon copy of that digest, not a new index around it
          docker buildx imagetools create --prefer-index=false \
            --tag "$image:stable" --tag "$image:$release" "$image@$digest"
          stable=$(docker buildx imagetools inspect "$image:stable" --format '{{.Manifest.Digest}}')
          [ "$stable" = "$digest" ] || fail "stable is $stable after the copy, not the tested $digest"
          docker logout ghcr.io
          echo "Promoted $digest as stable and $release"
