# The only writer of `stable` (spec 6.14). It runs on every push to main (a merge the owner made) and when
# ci.yml's merge job starts it (a merge made with GITHUB_TOKEN starts no push workflow). main's newest
# commit goes to `stable` only as the exact image its PR head was tested as: unit, scan, push and
# regression all green on that head, and the same tree. A commit that came from no PR (a direct push)
# promotes nothing and ships with the next tested update. A PR merge that does not match fails the run
# and the owner gets a message through the test bot (GitHub tells only whoever started a run, often a bot).
# Each promote is a release vX.Y.Z, numbered by the release rule from the PR title: the image also gets
# that tag, and a GitHub Release (with its git tag) carries the notes of the PRs since the previous one.
# The image must have been built as that version (ci.yml's unit); if not, nothing is released and the
# commit ships with the next release.
# Modified 2026 by megabitus98 (fork): new workflow

name: promote

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "The tested PR head that main came from (ci.yml's merge job passes it)"
        required: false
        type: string

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commits and trees; the release and its tag
      pull-requests: read # the PR a commit came from
      checks: read # unit, scan, push and regression on the tested head
      packages: write # tag stable, the dated tag and vX.Y.Z
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      image: ghcr.io/${{ github.repository }}
      given_head: ${{ inputs.head_sha }}
    steps:
      - name: Promote the tested image
        run: |
          # >>> release rule (identical in ci.yml and promote.yml; tests/repo/test_pipeline_files.py checks it)
          title_pattern='^(feat|fix|deps|docs|ci|test|build|chore|refactor|perf)(\([a-z0-9-]+\))?(!)?: .+'
          # next_version <previous tag or empty> <PR title>: the release this PR becomes; fails on an unknown title
          next_version() {
            local previous=$1 title=$2 type breaking major minor patch
            [[ "$title" =~ $title_pattern ]] || return 1
            type=${BASH_REMATCH[1]}
            breaking=${BASH_REMATCH[3]}
            if [ -z "$previous" ]; then echo v1.0.0; return 0; fi
            IFS=. read -r major minor patch <<< "${previous#v}"
            if [ -n "$breaking" ]; then echo "v$((major + 1)).0.0"
            elif [ "$type" = feat ]; then echo "v$major.$((minor + 1)).0"
            else echo "v$major.$minor.$((patch + 1))"; fi
          }
          # previous_tag <commit>: the highest vX.Y.Z tag on that commit or one of its ancestors (empty: none yet).
          # An API error fails (an empty answer would mean "no tags" and restart at v1.0.0); no tags at all is not an error.
          previous_tag() {
            local all_tags tag_name tag_sha status
            all_tags=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[] | "\(.name) \(.commit.sha)"') || return 1
            while read -r tag_name tag_sha; do
              status=$(gh api "repos/$GH_REPO/compare/$tag_sha...$1" --jq .status) || return 1
              case $status in ahead|identical) echo "$tag_name"; return 0 ;; esac
            done < <(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+ ' <<< "$all_tags" | sort -rV)
          }
          # previous_release <commit>...: the highest previous_tag over the given commits; promote passes every
          # parent of main's commit (after "Update branch" and a fast-forward, the first parent is the PR branch)
          previous_release() {
            local commit_sha found found_tags=""
            for commit_sha in "$@"; do
              found=$(previous_tag "$commit_sha") || return 1
              [ -n "$found" ] && found_tags+="$found"$'\n'
            done
            printf '%s' "$found_tags" | sort -V | tail -n 1
          }
          # <<< release rule

          # green <sha>: every ci job the release depends on succeeded on that commit: for each check
          # name, the most recently started run of it (a re-run or a later ci run on the same head
          # replaces an older result); pending, skipped or missing is not green
          green() {
            local check_name conclusion
            for check_name in unit scan push regression; do
              conclusion=$(gh api "repos/$GH_REPO/commits/$1/check-runs?check_name=$check_name&filter=all&per_page=100" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // empty')
              if [ "$conclusion" != success ]; then
                echo "$check_name on $1: ${conclusion:-missing}"
                return 1
              fi
            done
          }
          fail() { echo "::error::$1"; exit 1; }

          tree_of() { gh api "repos/$GH_REPO/git/commits/$1" --jq .tree.sha; }
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          : "${main_sha:?}"
          main_tree=$(tree_of "$main_sha")

          # the PR main came from: its title decides the release; GitHub can take a moment to link a
          # brand-new commit to its PR
          pr_json=""
          for attempt in 1 2 3 4 5 6; do
            pr_json=$(gh api "repos/$GH_REPO/commits/$main_sha/pulls" \
              --jq "[.[] | select(.merge_commit_sha == \"$main_sha\")][0] // empty")
            [ -n "$pr_json" ] && break
            [ "$attempt" = 6 ] || sleep 10
          done
          if [ -z "$pr_json" ] && [ -n "$given_head" ]; then
            [[ "$given_head" =~ ^[0-9a-f]{40}$ ]] || fail "head_sha '$given_head' is not a commit SHA"
            pr_json=$(gh api "repos/$GH_REPO/commits/$given_head/pulls" \
              --jq "[.[] | select(.head.sha == \"$given_head\")][0] // empty")
          fi
          if [ -z "$pr_json" ]; then
            echo "::notice::main $main_sha came from no pull request; stable stays as it is and this commit ships with the next tested update"
            exit 0
          fi
          pr_number=$(jq -r .number <<< "$pr_json")
          pr_title=$(jq -r .title <<< "$pr_json")
          head_sha=$(jq -r .head.sha <<< "$pr_json")
          if [ -n "$given_head" ]; then
            [[ "$given_head" =~ ^[0-9a-f]{40}$ ]] || fail "head_sha '$given_head' is not a commit SHA"
            # main may have moved on since the merge that passed this head; then main's own PR decides
            [ "$(tree_of "$given_head")" = "$main_tree" ] && head_sha=$given_head
          fi
          green "$head_sha" || fail "the tested head $head_sha of main $main_sha is not green; nothing promoted"
          head_tree=$(tree_of "$head_sha")
          [ -n "$main_tree" ] && [ "$main_tree" = "$head_tree" ] \
            || fail "main $main_sha and the tested head $head_sha have different trees (merged while behind main?); nothing promoted"

          # The version: a re-run finds the tag it made before; otherwise the rule above, from the highest
          # release on any parent of main's commit. Every part below is safe to run twice.
          all_tags=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[] | "\(.name) \(.commit.sha)"')
          version=$(awk -v sha="$main_sha" '$2 == sha && $1 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {print $1; exit}' <<< "$all_tags")
          parents_text=$(gh api "repos/$GH_REPO/commits/$main_sha" --jq '.parents[].sha')
          mapfile -t parent_shas <<< "$parents_text"
          previous=$(previous_release "${parent_shas[@]}")
          if [ -z "$version" ]; then
            version=$(next_version "$previous" "$pr_title") \
              || fail "the title of PR #$pr_number does not match $title_pattern; nothing promoted"
            if gh api "repos/$GH_REPO/git/ref/tags/$version" > /dev/null 2>&1; then
              fail "$version is already a tag on another commit; main $main_sha ships with the next release"
            fi
          fi

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest=$(docker buildx imagetools inspect "$image:sha-$head_sha" --format '{{.Manifest.Digest}}') \
            || fail "no image $image:sha-$head_sha; nothing promoted"
          # the version unit baked in must be this release (single image or one entry per platform)
          built_as=$(docker buildx imagetools inspect "$image@$digest" --format '{{json .Image}}' \
            | jq -r '(.config // (to_entries[0].value.config)).Labels["org.opencontainers.image.version"] // empty')
          [ "$built_as" = "$version" ] \
            || fail "the image was built as ${built_as:-no version}, the release would be $version (title type changed after CI, or another release landed first); main $main_sha ships with the next release"
          # a version number belongs to one build: an existing :vX.Y.Z on another image is never moved
          current_version=$(docker buildx imagetools inspect "$image:$version" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -n "$current_version" ] && [ "$current_version" != "$digest" ]; then
            fail "$image:$version already points at $current_version, not the tested $digest; nothing promoted"
          fi

          # The release first: creating it also creates the git tag on main's commit, so the version is taken
          # before any image tag moves. If tagging the image fails below, the next PR still numbers past it,
          # and a re-run finds the tag and finishes.
          if gh api "repos/$GH_REPO/releases/tags/$version" > /dev/null 2>&1; then
            echo "release $version already exists"
          else
            # the notes: every PR merged since the previous release, newest first (normally just this one)
            if [ -n "$previous" ]; then
              commits=$(gh api "repos/$GH_REPO/compare/$previous...$main_sha" --jq '.commits[].sha')
            else
              commits=$main_sha
            fi
            pr_numbers=$(for commit_sha in $commits; do
                gh api "repos/$GH_REPO/commits/$commit_sha/pulls" \
                  --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number'
              done | awk '!seen[$0]++' | tac)
            : > "$RUNNER_TEMP/notes.md"
            for note_pr in $pr_numbers; do
              gh api "repos/$GH_REPO/pulls/$note_pr" --jq '"## \(.title) (#\(.number))\n\n\((.body // "") | if length > 20000 then .[:20000] + "\n\n(cut here, the full text is in the pull request)" else . end)\n"' >> "$RUNNER_TEMP/notes.md"
            done
            # GitHub refuses a release body over 125000 characters; cut by characters, not bytes
            notes_limit=100000
            jq -Rrs --argjson notes_limit "$notes_limit" \
              'if length > $notes_limit then .[:$notes_limit] + "\n\n(cut here, see the pull requests)" else . end' \
              "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/notes-cut.md"
            gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$version" -f target_commitish="$main_sha" \
              -f name="$version: $pr_title" -F body=@"$RUNNER_TEMP/notes-cut.md" -f make_latest=true > /dev/null
          fi

          # then the image tags; dated by the main commit, not the run, so a re-run does not mint another tag
          main_date=$(gh api "repos/$GH_REPO/commits/$main_sha" --jq .commit.committer.date)
          dated="$(date -u -d "$main_date" +%Y.%m.%d)-${main_sha:0:7}"
          current_stable=$(docker buildx imagetools inspect "$image:stable" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ "$current_stable" = "$digest" ] && [ "$current_version" = "$digest" ]; then
            echo "stable and $version are already $digest"
          else
            # --prefer-index=false: a carbon copy of that digest, not a new index around it
            docker buildx imagetools create --prefer-index=false \
              --tag "$image:stable" --tag "$image:$dated" --tag "$image:$version" "$image@$digest"
            current_stable=$(docker buildx imagetools inspect "$image:stable" --format '{{.Manifest.Digest}}')
            [ "$current_stable" = "$digest" ] || fail "stable is $current_stable after the copy, not the tested $digest"
          fi
          docker logout ghcr.io
          echo "Released $version: $digest as stable, $dated and $version"

      - name: Tell the owner
        if: failure() || cancelled()
        env:
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          text: "Yattoko: promote failed, see the run for what moved. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$TEST_BOT_TOKEN" ] || [ -z "$TEST_CHAT_ID" ]; then
            echo "::error::no test bot secrets: nobody is told about this failure"
            exit 1
          fi
          # the token and the chat go through curl's config on stdin, not the command line
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\ndata-urlencode = "chat_id=%s"\n' "$TEST_BOT_TOKEN" "$TEST_CHAT_ID" |
            curl -fsS -K - --data-urlencode "text=$text" -o /dev/null
