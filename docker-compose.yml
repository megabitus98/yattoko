# Local run: one container, SQLite on the data volume, no Redis or other database.
# Modified 2026 by megabitus98 (fork): one service built from this repository, volumes for /data and /tmp, read-only root
services:
  ytdlbot:
    build:
      context: .
      target: runtime
    image: ytdlbot:local
    env_file: .env
    restart: unless-stopped
    read_only: true
    volumes:
      - ytdlbot-data:/data
      - ytdlbot-tmp:/tmp

volumes:
  ytdlbot-data:
  ytdlbot-tmp:
